<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #0E131D; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; gap: 20px; padding: 40px; }
  .card { background: #151D2A; border: 1px solid #1E293B; border-radius: 16px; padding: 24px; width: 170px; text-align: center; }
  .icon-wrap { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; }
  .student { background: rgba(0, 229, 153, 0.1); color: #00E599; border: 1px solid rgba(0, 229, 153, 0.3); }
  .coach { background: rgba(245, 158, 11, 0.1); color: #F59E0B; border: 1px solid rgba(245, 158, 11, 0.3); }
  svg { width: 32px; height: 32px; }
  h4 { margin: 0 0 6px 0; font-size: 13px; }
  p { margin: 0; font-size: 11px; color: #94A3B8; }
</style>
</head>
<body>
  <!-- Student Reference -->
  <div class="card">
    <div class="icon-wrap student">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
      </svg>
    </div>
    <h4>Student</h4>
    <p>Current Reference</p>
  </div>

  <!-- Design A: Clean Horizontal Sports Whistle with Lanyard Ring -->
  <div class="card">
    <div class="icon-wrap coach">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 7h-6.14C11.64 5.75 9.94 5 8 5 4.69 5 2 7.69 2 11s2.69 6 6 6c1.94 0 3.64-.75 4.86-2H17l2 4h3l-2.5-5H20c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2zm-5 4h-4V7.5c1.4 0 2.5.85 2.86 2.05L13 11h1z"/>
      </svg>
    </div>
    <h4>Design A: Whistle</h4>
    <p>Athletic Director</p>
  </div>

  <!-- Design B: Coach Tactical Clipboard with Whistle / Check -->
  <div class="card">
    <div class="icon-wrap coach">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm-2 14l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
      </svg>
    </div>
    <h4>Design B: Clipboard</h4>
    <p>Workout & Roster</p>
  </div>

  <!-- Design C: Coach / Trainer (Person with Whistle / Lanyard) -->
  <div class="card">
    <div class="icon-wrap coach">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <!-- Head with coach visor/cap -->
        <path d="M12 2a4 4 0 0 0-4 4c0 1.95 1.4 3.58 3.25 3.93L10 12l2 2 2-2-1.25-2.07A4.004 4.004 0 0 0 16 6a4 4 0 0 0-4-4z"/>
        <!-- Shoulders with coach lanyard/whistle badge -->
        <path d="M4 18c0-2.66 5.33-4 8-4s8 1.34 8 4v2H4v-2zm7-2.5h2v1.5h-2v-1.5z"/>
      </svg>
    </div>
    <h4>Design C: Trainer Person</h4>
    <p>Instructor with Lanyard</p>
  </div>

  <!-- Design D: Athletic Stopwatch / Timer (Classic Track & Fitness Coach) -->
  <div class="card">
    <div class="icon-wrap coach">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M19.03 7.39l1.42-1.42c-.45-.51-.9-.99-1.41-1.41l-1.42 1.42C16.07 4.74 14.12 4 12 4c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-2.12-.74-4.07-1.97-5.61zM13 14h-2V8h2v6zm-1-12c.83 0 1.5.67 1.5 1.5S12.83 5 12 5s-1.5-.67-1.5-1.5S11.17 2 12 2z"/>
      </svg>
    </div>
    <h4>Design D: Stopwatch</h4>
    <p>Cadence & Performance</p>
  </div>
</body>
</html>

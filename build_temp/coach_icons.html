<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #0E131D; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; gap: 30px; padding: 40px; }
  .card { background: #151D2A; border: 1px solid #1E293B; border-radius: 16px; padding: 24px; width: 180px; text-align: center; }
  .icon-wrap { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; }
  .student { background: rgba(0, 229, 153, 0.1); color: #00E599; border: 1px solid rgba(0, 229, 153, 0.3); }
  .coach { background: rgba(245, 158, 11, 0.1); color: #F59E0B; border: 1px solid rgba(245, 158, 11, 0.3); }
  svg { width: 32px; height: 32px; }
  h4 { margin: 0 0 6px 0; font-size: 14px; }
  p { margin: 0; font-size: 12px; color: #94A3B8; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap student">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
      </svg>
    </div>
    <h4>Student (Current)</h4>
    <p>Athletic Member</p>
  </div>

  <div class="card">
    <div class="icon-wrap coach">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M8.5 4a6.5 6.5 0 0 0-6.5 6.5C2 14.09 4.91 17 8.5 17c1.47 0 2.82-.49 3.91-1.31l1.64 3.28c.38.76 1.44.89 2 .25l1.83-2.11c.45-.52.5-1.28.12-1.85L16.29 13H19c2.76 0 5-2.24 5-5s-2.24-5-5-5h-8.5zm4.5 5h-4V6h4v3z"/>
      </svg>
    </div>
    <h4>Whistle (Material)</h4>
    <p>Athletic Coach</p>
  </div>

  <div class="card">
    <div class="icon-wrap coach">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm-2 10c-3.31 0-6 2.69-6 6v2h12.5a5.5 5.5 0 0 1-.5-2.25c0-.85.2-1.65.55-2.37L15 15.1V13.5l1.8-1.5H10zm9.5 2a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm1.5 2.5h-1.5V18h1.5v-1.5z"/>
      </svg>
    </div>
    <h4>Instructor + Badge</h4>
    <p>Trainer Certification</p>
  </div>

  <div class="card">
    <div class="icon-wrap coach">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M19.5 4H10C6.96 4 4.5 6.46 4.5 9.5c0 2.61 1.83 4.79 4.3 5.34l-1.6 3.19c-.38.76.17 1.67 1.03 1.67h2.04c.37 0 .72-.2 1-.53l1.83-2.17H19.5c2.48 0 4.5-2.02 4.5-4.5S21.98 4 19.5 4zm-4.5 5h-3V6.5c1.1 0 2 .9 2 2V9h1z"/>
      </svg>
    </div>
    <h4>Coach Whistle (Bold)</h4>
    <p>Fitness Director</p>
  </div>
</body>
</html>

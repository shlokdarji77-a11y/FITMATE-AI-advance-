<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #0E131D; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; gap: 20px; padding: 40px; }
  .card { background: #151D2A; border: 1px solid #1E293B; border-radius: 16px; padding: 24px; width: 180px; text-align: center; }
  .icon-wrap { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; }
  .student { background: rgba(0, 229, 153, 0.1); color: #00E599; border: 1px solid rgba(0, 229, 153, 0.3); }
  .coach { background: rgba(245, 158, 11, 0.1); color: #F59E0B; border: 1px solid rgba(245, 158, 11, 0.3); }
  svg { width: 32px; height: 32px; }
  h4 { margin: 0 0 6px 0; font-size: 13px; }
  p { margin: 0; font-size: 11px; color: #94A3B8; }
</style>
</head>
<body>
  <!-- Student Reference -->
  <div class="card">
    <div class="icon-wrap student">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
      </svg>
    </div>
    <h4>Student</h4>
    <p>Current Reference</p>
  </div>

  <!-- Option 1: Classic Athletic Coach Whistle (Centered, clean) -->
  <div class="card">
    <div class="icon-wrap coach">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M11 3C6.58 3 3 6.58 3 11c0 3.86 2.74 7.08 6.42 7.82L7.6 22.42c-.28.56.13 1.22.76 1.22h2.28c.31 0 .6-.17.75-.44l2.12-3.82c.2-.36.58-.58.99-.58H19c2.76 0 5-2.24 5-5s-2.24-5-5-5h-4.2C13.88 5.37 12.56 3 11 3zm3 6h-3V5.5c.89 0 1.67.54 2 1.32V9z"/>
      </svg>
    </div>
    <h4>Whistle (Athletic)</h4>
    <p>Centered Coach Whistle</p>
  </div>

  <!-- Option 2: Coach Board / Assignment Board (Teacher/Coach in FITMATE AI) -->
  <div class="card">
    <div class="icon-wrap coach">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm-2 14l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
      </svg>
    </div>
    <h4>Coach Tactical Board</h4>
    <p>Roster & Verification</p>
  </div>

  <!-- Option 3: Whistle angled 45 degrees with loop (High recognizability) -->
  <div class="card">
    <div class="icon-wrap coach">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M14.5 3H8C4.69 3 2 5.69 2 9c0 2.8 1.93 5.15 4.54 5.82L4.63 19.3c-.34.68.15 1.49.91 1.49h2.15c.34 0 .66-.19.83-.5l2-3.69c.22-.4.64-.65 1.1-.65H18c2.76 0 5-2.24 5-5s-2.24-5-5-5h-3.5zm-.5 4.5h-3.5V5.5c.95 0 1.8.6 2.15 1.45L13 7.5h1z"/>
      </svg>
    </div>
    <h4>Sport Whistle 45</h4>
    <p>Trainer Symbol</p>
  </div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #0E131D; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; gap: 20px; padding: 40px; }
  .card { background: #151D2A; border: 1px solid #1E293B; border-radius: 16px; padding: 24px; width: 180px; text-align: center; }
  .icon-wrap { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; }
  .student { background: rgba(0, 229, 153, 0.1); color: #00E599; border: 1px solid rgba(0, 229, 153, 0.3); }
  .coach { background: rgba(245, 158, 11, 0.1); color: #F59E0B; border: 1px solid rgba(245, 158, 11, 0.3); }
  svg { width: 32px; height: 32px; }
  h4 { margin: 0 0 6px 0; font-size: 13px; }
  p { margin: 0; font-size: 11px; color: #94A3B8; }
</style>
</head>
<body>
  <!-- Student Reference -->
  <div class="card">
    <div class="icon-wrap student">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
      </svg>
    </div>
    <h4>Student</h4>
    <p>Current Reference</p>
  </div>

  <!-- Tactical Board (Verification & Curriculum) -->
  <div class="card">
    <div class="icon-wrap coach">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm-2 14l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
      </svg>
    </div>
    <h4>Tactical Clipboard</h4>
    <p>Workout Verification</p>
  </div>

  <!-- FontAwesome Sports Whistle -->
  <div class="card">
    <div class="icon-wrap coach">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M21.2 8.3l-5.6-2.8C14.7 4.9 13.4 4.5 12 4.5c-4.1 0-7.5 3.4-7.5 7.5s3.4 7.5 7.5 7.5c3.5 0 6.5-2.5 7.3-5.8l2.2-.7c.8-.3 1.3-1.1 1.3-1.9v-1.1c0-.9-.6-1.6-1.6-1.7zm-9.2 8.7c-2.8 0-5-2.2-5-5s2.2-5 5-5c1 0 1.9.3 2.7.8l-4.4 4.4c-.4.4-.4 1 0 1.4s1 .4 1.4 0l4.4-4.4c.5.8.8 1.7.8 2.8 0 2.8-2.2 5-4.9 5z"/>
      </svg>
    </div>
    <h4>FA Sports Whistle</h4>
    <p>Official Whistle</p>
  </div>

  <!-- Coach / Instructor / Teacher Figure -->
  <div class="card">
    <div class="icon-wrap coach">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M9 11c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm11.5-6.5l-3 3-1.5-1.5L15 9l2.5 2.5 4-4-1-1z"/>
      </svg>
    </div>
    <h4>Instructor + Badge</h4>
    <p>Supervisor Account</p>
  </div>
</body>
</html>
